name: Build

# 触发条件：推送到主分支及开发分支、提交 Pull Request、打 v* 标签、手动运行
on:
  push:
    branches: [ main, master, trae/agent-tofPSD ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# tag 触发创建 Release 需要 contents: write 权限
permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Package (Windows)
    # 公共仓库使用 GitHub 托管 Windows runner 完全免费、无时长限制
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: 'latest'

      # 项目使用 packages.config（非 SDK-style），必须用 nuget.exe 还原
      - name: Restore NuGet packages
        run: nuget restore SmartShift.sln

      # 编译整个解决方案（Release / Any CPU）
      - name: Build (Release)
        run: msbuild SmartShift.sln /p:Configuration=Release /p:Platform="Any CPU" /m /v:minimal /nologo

      # 运行 xunit 测试（通过 VSTest 适配器）
      - name: Run tests
        shell: pwsh
        run: |
          $vsTest = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -find "Common7\IDE\Extensions\TestPlatform\vstest.console.exe" | Select-Object -First 1
          & $vsTest "SmartShift.Tests\bin\Release\SmartShift.Tests.dll" /Parallel /Platform:x64 /Logger:trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

      # 将编译输出目录打包成 zip，便于直接下载运行
      - name: Pack Release output
        shell: pwsh
        run: |
          $src = "SmartShift.UI\bin\Release"
          $dst = "SmartShift-Release\SmartShift-Release.zip"
          New-Item -ItemType Directory -Force -Path "SmartShift-Release" | Out-Null
          Compress-Archive -Path "$src\*" -DestinationPath $dst -CompressionLevel Optimal
          Write-Host "Packed -> $dst"

      - name: Upload Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartShift-Release
          path: SmartShift-Release/SmartShift-Release.zip
          if-no-files-found: error
          retention-days: 30

      # 仅在打 v* 标签时，在同一个 job 内创建 GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SmartShift-Release/SmartShift-Release.zip
          generate_release_notes: true
          draft: false
          # 标签名含 '-' 视为预发布（如 v1.0.0-beta）
          prerelease: ${{ contains(github.ref_name, '-') }}
